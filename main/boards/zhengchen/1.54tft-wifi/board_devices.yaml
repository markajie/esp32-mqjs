version: 1.0.0
devices:
  - name: display_lcd
    chip: st7789
    type: display_lcd
    sub_type: spi
    version: default
    config:
      x_max: 240
      y_max: 240
      swap_xy: false
      mirror_x: false
      mirror_y: false
      invert_color: true
      need_reset: true
      io_spi_config:
        cs_gpio_num: 21
        dc_gpio_num: 40
        spi_mode: 3
        pclk_hz: 80000000
        trans_queue_depth: 10
        lcd_cmd_bits: 8
        lcd_param_bits: 8
      lcd_panel_config:
        reset_gpio_num: 45
        rgb_ele_order: LCD_RGB_ELEMENT_ORDER_RGB
        data_endian: LCD_RGB_DATA_ENDIAN_BIG
        bits_per_pixel: 16
    peripherals:
      - name: spi_display

  - name: lcd_brightness
    type: ledc_ctrl
    version: default
    config:
      default_percent: 0
    peripherals:
      - name: ledc_backlight

version: 1.0.0
peripherals:
  - name: spi_display
    type: spi
    role: master
    config:
      spi_bus_config:
        spi_port: SPI2_HOST
        data0_io_num: 9
        data1_io_num: 8
        data2_io_num: 7
        data3_io_num: 6
        sclk_io_num: 0
        max_transfer_sz: 14400

  - name: ledc_backlight
    type: ledc
    role: none
    config:
      gpio_num: 2
      freq_hz: 5000
      duty: 0
      duty_resolution: LEDC_TIMER_10_BIT
      output_invert: false

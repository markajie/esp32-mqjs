version: 1.0.0
devices:
  - name: display_lcd
    chip: st77916
    type: display_lcd
    sub_type: spi
    version: default
    dependencies:
      espressif/esp_lcd_st77916: "*"
    config:
      x_max: 360
      y_max: 360
      io_spi_config:
        cs_gpio_num: 3
        dc_gpio_num: -1
        spi_mode: 0
        lcd_cmd_bits: 32
        flags:
          quad_mode: true
      lcd_panel_config:
        reset_gpio_num: 1
        vendor_config: NULL
    peripherals:
      - name: spi_display

  - name: lcd_brightness
    type: ledc_ctrl
    version: default
    config:
      default_percent: 0
    peripherals:
      - name: ledc_backlight
